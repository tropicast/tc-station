name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TC_REQUIRE_FFMPEG: "1"

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf make perl curl tar diffutils

      - name: Cache source-built FFmpeg bundles
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: artifacts/ffmpeg/
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'THIRD_PARTY_NOTICES') }}

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh win-x64

      - name: Build FFmpeg (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh linux-x64

      - name: Build FFmpeg (macOS Apple Silicon and Intel)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-ffmpeg.sh osx-arm64
          bash scripts/build-ffmpeg.sh osx-x64

      - name: Restore
        run: dotnet restore Tropicast.Station.slnx

      - name: Build
        run: dotnet build Tropicast.Station.slnx -c Release --no-restore

      - name: Test native macOS buffer layouts
        if: runner.os == 'macOS'
        run: |
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -mmacosx-version-min=13.0 -framework Foundation -framework AVFoundation \
            -framework AudioToolbox -framework CoreAudio -framework ScreenCaptureKit \
            -framework CoreMedia -framework CoreGraphics \
            src/Tropicast.Station.Audio.MacOS/Native/AudioBridgeTests.m -o "$RUNNER_TEMP/tc-native-tests"
          "$RUNNER_TEMP/tc-native-tests"

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          TC_TEST_OS_SECRETS: "1"
        run: >
          dotnet test Tropicast.Station.slnx -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Prepare Linux keyring and PulseAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus pulseaudio pulseaudio-utils icecast2

      - name: Test (Linux with unlocked keyring and isolated PulseAudio)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "tc-ci-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            export PULSE_SERVER="unix:$RUNNER_TEMP/tc-pulse.sock"
            pulseaudio -n --daemonize=no --exit-idle-time=-1 --use-pid-file=no \
              --load="module-native-protocol-unix socket=$RUNNER_TEMP/tc-pulse.sock auth-anonymous=1" \
              --load="module-null-sink sink_name=tc_ci_default" > "$RUNNER_TEMP/tc-pulse.log" 2>&1 &
            pulse_pid=$!
            mkdir -p TestResults
            icecast2 -c tests/Tropicast.Station.Encoding.Tests/icecast.xml > "$RUNNER_TEMP/tc-icecast.log" 2>&1 &
            icecast_pid=$!
            trap "kill $pulse_pid $icecast_pid; wait $pulse_pid $icecast_pid || true" EXIT
            for attempt in {1..50}; do
              if pactl info > /dev/null 2>&1; then break; fi
              sleep 0.1
            done
            pactl info || { cat "$RUNNER_TEMP/tc-pulse.log"; exit 1; }
            pactl set-default-sink tc_ci_default
            pactl set-default-source tc_ci_default.monitor
            for attempt in {1..50}; do
              if curl -fsS http://127.0.0.1:18000/status-json.xsl > /dev/null; then break; fi
              sleep 0.1
            done
            curl -fsS http://127.0.0.1:18000/status-json.xsl > /dev/null || { cat "$RUNNER_TEMP/tc-icecast.log"; exit 1; }
            TC_TEST_OS_SECRETS=1 TC_TEST_PULSE=1 TC_TEST_PULSE_DEFAULTS=1 TC_TEST_ICECAST_PORT=18000 \
              TC_TEST_ICECAST_EXECUTABLE=/usr/bin/icecast2 \
              dotnet test Tropicast.Station.slnx -c Release --no-build --logger trx --results-directory TestResults
          '

      - name: Test (macOS with temporary keychain)
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/tc-test.keychain-db"
          security create-keychain -p tc-ci-test-keyring "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p tc-ci-test-keyring "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          TC_TEST_OS_SECRETS=1 dotnet test Tropicast.Station.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

      - name: Build macOS app bundles (Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-macos.sh osx-arm64
          bash scripts/build-macos.sh osx-x64
          lipo src/Tropicast.Station.Audio.MacOS/obj/native/libtropicast_audio.dylib -verify_arch arm64 x86_64
          for rid in osx-arm64 osx-x64; do
            bundle="artifacts/$rid/Tropicast Station.app"
            test -f "$bundle/Contents/MacOS/libtropicast_audio.dylib"
            test -x "$bundle/Contents/MacOS/Tropicast.Station"
            test -x "$bundle/Contents/MacOS/ffmpeg/ffmpeg"
          done
