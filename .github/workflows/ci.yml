name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Tropicast.Station.slnx

      - name: Build
        run: dotnet build Tropicast.Station.slnx -c Release --no-restore

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          TC_TEST_OS_SECRETS: "1"
        run: >
          dotnet test Tropicast.Station.slnx -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Prepare Linux keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus

      - name: Test (Linux with unlocked keyring)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "tc-ci-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            TC_TEST_OS_SECRETS=1 dotnet test Tropicast.Station.slnx -c Release --no-build --logger trx --results-directory TestResults
          '

      - name: Test (macOS with temporary keychain)
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/tc-test.keychain-db"
          security create-keychain -p tc-ci-test-keyring "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p tc-ci-test-keyring "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          TC_TEST_OS_SECRETS=1 dotnet test Tropicast.Station.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore
