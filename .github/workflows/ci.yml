name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TC_REQUIRE_FFMPEG: "1"

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare Windows native toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf make perl curl tar diffutils

      - name: Cache source-built FFmpeg bundles
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: artifacts/ffmpeg/
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'THIRD_PARTY_NOTICES') }}

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh win-x64

      - name: Build FFmpeg (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh linux-x64

      - name: Build FFmpeg (macOS Apple Silicon and Intel)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-ffmpeg.sh osx-arm64
          bash scripts/build-ffmpeg.sh osx-x64

      - name: Restore
        run: dotnet restore Tropicast.Station.slnx

      - name: Build
        run: dotnet build Tropicast.Station.slnx -c Release --no-restore

      - name: Test native macOS buffer layouts
        if: runner.os == 'macOS'
        run: |
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -mmacosx-version-min=13.0 -framework Foundation -framework AVFoundation \
            -framework AudioToolbox -framework CoreAudio -framework ScreenCaptureKit \
            -framework CoreMedia -framework CoreGraphics \
            src/Tropicast.Station.Audio.MacOS/Native/AudioBridgeTests.m -o "$RUNNER_TEMP/tc-native-tests"
          "$RUNNER_TEMP/tc-native-tests"

      - name: Test (Windows)
        if: runner.os == 'Windows'
        env:
          TC_TEST_OS_SECRETS: "1"
        run: >
          dotnet test Tropicast.Station.slnx -c Release --no-build
          --logger trx --results-directory TestResults

      - name: Prepare Linux keyring and PulseAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus pulseaudio pulseaudio-utils icecast2

      - name: Test (Linux with unlocked keyring and isolated PulseAudio)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "%s" "tc-ci-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            export PULSE_SERVER="unix:$RUNNER_TEMP/tc-pulse.sock"
            pulseaudio -n --daemonize=no --exit-idle-time=-1 --use-pid-file=no \
              --load="module-native-protocol-unix socket=$RUNNER_TEMP/tc-pulse.sock auth-anonymous=1" \
              --load="module-null-sink sink_name=tc_ci_default" > "$RUNNER_TEMP/tc-pulse.log" 2>&1 &
            pulse_pid=$!
            mkdir -p TestResults
            icecast2 -c tests/Tropicast.Station.Encoding.Tests/icecast.xml > "$RUNNER_TEMP/tc-icecast.log" 2>&1 &
            tropicast_pid=$!
            trap "kill $pulse_pid $tropicast_pid; wait $pulse_pid $tropicast_pid || true" EXIT
            for attempt in {1..50}; do
              if pactl info > /dev/null 2>&1; then break; fi
              sleep 0.1
            done
            pactl info || { cat "$RUNNER_TEMP/tc-pulse.log"; exit 1; }
            pactl set-default-sink tc_ci_default
            pactl set-default-source tc_ci_default.monitor
            for attempt in {1..50}; do
              if curl -fsS http://127.0.0.1:18000/status-json.xsl > /dev/null; then break; fi
              sleep 0.1
            done
            curl -fsS http://127.0.0.1:18000/status-json.xsl > /dev/null || { cat "$RUNNER_TEMP/tc-icecast.log"; exit 1; }
            TC_TEST_OS_SECRETS=1 TC_TEST_PULSE=1 TC_TEST_PULSE_DEFAULTS=1 TC_TEST_ICECAST_PORT=18000 \
              TC_TEST_ICECAST_EXECUTABLE=/usr/bin/icecast2 \
              dotnet test Tropicast.Station.slnx -c Release --no-build --logger trx --results-directory TestResults
          '

      - name: Test (macOS with temporary keychain)
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/tc-test.keychain-db"
          security create-keychain -p tc-ci-test-keyring "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p tc-ci-test-keyring "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          TC_TEST_OS_SECRETS=1 dotnet test Tropicast.Station.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        # Artifacts are a convenience: a full storage quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

      - name: Package macOS disk images (Apple Silicon and Intel, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          bash scripts/package-macos.sh osx-arm64
          bash scripts/package-macos.sh osx-x64
          lipo src/Tropicast.Station.Audio.MacOS/obj/native/libtropicast_audio.dylib -verify_arch arm64 x86_64
          for rid in osx-arm64 osx-x64; do
            bundle="artifacts/$rid/Tropicast Station.app"
            test -f "$bundle/Contents/MacOS/libtropicast_audio.dylib"
            test -x "$bundle/Contents/MacOS/Tropicast.Station"
            test -x "$bundle/Contents/MacOS/ffmpeg/ffmpeg"
            test -f "$bundle/Contents/Resources/tropicast.icns"
            image="artifacts/package/Tropicast-Station-0.1.0-$rid.dmg"
            mount="$RUNNER_TEMP/tc-dmg-$rid"
            mkdir -p "$mount"
            hdiutil attach "$image" -mountpoint "$mount" -nobrowse -readonly
            test -x "$mount/Tropicast Station.app/Contents/MacOS/Tropicast.Station"
            test -f "$mount/THIRD_PARTY_NOTICES.txt"
            codesign --verify --deep --strict "$mount/Tropicast Station.app"
            hdiutil detach "$mount"
          done

      - name: Package and install-test MSIX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -Version 0.1.0 -TestSign
          Import-Certificate -FilePath artifacts/package/tropicast-test-signing.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage artifacts/package/Tropicast-Station-0.1.0-win-x64.msix
          $pkg = Get-AppxPackage Tropicast.Station
          if (-not $pkg) { throw 'The MSIX did not install.' }
          foreach ($file in 'Tropicast.Station.exe', 'ffmpeg\ffmpeg.exe', 'ffmpeg\THIRD_PARTY_NOTICES', 'THIRD_PARTY_NOTICES') {
            if (-not (Test-Path (Join-Path $pkg.InstallLocation $file))) { throw "Installed package is missing $file." }
          }
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!TropicastStation"
          Start-Sleep -Seconds 15
          $app = Get-Process -Name Tropicast.Station -ErrorAction SilentlyContinue
          if (-not $app) { throw 'The installed app did not stay running.' }
          $app | Stop-Process -Force
          Remove-AppxPackage $pkg.PackageFullName

      - name: Package MSIX with an untrusted PFX certificate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Regression test for the release signing path: a self-signed PFX must build with a warning only.
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Tropicast' -KeyUsage DigitalSignature `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = ConvertTo-SecureString 'tc-ci-pfx' -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP 'tc-untrusted.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          $env:TC_WINDOWS_PFX_PATH = $pfx
          $env:TC_WINDOWS_PFX_PASSWORD = 'tc-ci-pfx'
          $env:TC_MSIX_PUBLISHER = 'CN=Tropicast'
          pwsh -NoProfile -File ./scripts/package-windows.ps1 -Version 0.1.0
          if ($LASTEXITCODE -ne 0) { throw "Untrusted PFX build exited with $LASTEXITCODE." }
          if (-not (Test-Path artifacts/package/Tropicast-Station-0.1.0-win-x64.msix)) { throw 'The MSIX was not produced.' }
          $env:TC_REQUIRE_TRUSTED_CHAIN = '1'
          $strictFailed = $false
          pwsh -NoProfile -File ./scripts/package-windows.ps1 -Version 0.1.0
          if ($LASTEXITCODE -ne 0) { $strictFailed = $true }
          if (-not $strictFailed) { throw 'TC_REQUIRE_TRUSTED_CHAIN=1 must reject an untrusted certificate.' }
          Remove-Item $pfx -Force
          $global:LASTEXITCODE = 0

      - name: Package and smoke-test AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb xauth desktop-file-utils
          bash scripts/package-linux.sh
          image="$PWD/artifacts/package/Tropicast-Station-0.1.0-x86_64.AppImage"
          xvfb-run -a "$image" --appimage-extract-and-run > "$RUNNER_TEMP/tc-appimage.log" 2>&1 &
          for attempt in {1..30}; do
            if pgrep -f 'usr/bin/Tropicast.Station$' > /dev/null; then break; fi
            sleep 1
          done
          sleep 10
          pgrep -f 'usr/bin/Tropicast.Station$' > /dev/null || { cat "$RUNNER_TEMP/tc-appimage.log"; exit 1; }
          pkill -f 'usr/bin/Tropicast.Station$'

      - name: Upload packages
        # Artifacts are a convenience: a full storage quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: |
            artifacts/package/*.AppImage
            artifacts/package/*.dmg
            artifacts/package/*.msix
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end (Tropicast container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache source-built FFmpeg bundles
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: artifacts/ffmpeg/
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'THIRD_PARTY_NOTICES') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh linux-x64

      - uses: docker/setup-buildx-action@v3

      - name: Build the Tropicast Icecast image
        uses: docker/build-push-action@v6
        with:
          context: tests/Tropicast.Station.E2E.Tests/docker
          load: true
          tags: tropicast-station-e2e:ci
          cache-from: type=gha,scope=tropicast-e2e-image
          cache-to: type=gha,scope=tropicast-e2e-image,mode=max

      - name: Run end-to-end tests
        env:
          TC_E2E_IMAGE: tropicast-station-e2e:ci
          TC_E2E_REQUIRED: "1"
        run: >
          dotnet test tests/Tropicast.Station.E2E.Tests -c Release
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        # Artifacts are a convenience: a full storage quota must not fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-e2e
          path: TestResults/
          if-no-files-found: ignore
